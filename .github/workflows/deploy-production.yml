name: Deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
      VITE_WORKOS_REDIRECT_URI: ${{ vars.VITE_WORKOS_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for backend changes
        id: backend-changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- packages/backend/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint web
        run: bun run --cwd apps/code/web lint
      - name: Typecheck web, backend, and serial
        run: |
          bun run --cwd apps/code/web typecheck
          bun run --cwd packages/backend typecheck
          bun run --cwd packages/serial typecheck
      - name: Test web, backend, and serial
        run: |
          bun run --cwd apps/code/web test
          bun run --cwd packages/backend test
          bun run --cwd packages/serial test
      - name: Build web
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing VITE_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/code/web
      - name: Deploy Convex backend
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || steps.backend-changes.outputs.changed == 'true')
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *) echo "CONVEX_DEPLOY_KEY must be a production deployment key" >&2; exit 1 ;;
          esac
          bun run deploy --typecheck enable \
            --cmd-url-env-var-name CONVEX_TARGET_URL \
            --cmd 'if [ "$CONVEX_TARGET_URL" != "$VITE_CONVEX_URL" ]; then echo "Convex deploy key does not match VITE_CONVEX_URL" >&2; exit 1; fi'
      - name: Deploy Cloudflare Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          bunx wrangler deploy --keep-vars \
            --var "VITE_CONVEX_URL:${VITE_CONVEX_URL}" \
            --var "VITE_WORKOS_CLIENT_ID:${VITE_WORKOS_CLIENT_ID}" \
            --var "VITE_WORKOS_REDIRECT_URI:${VITE_WORKOS_REDIRECT_URI}"
        working-directory: apps/code/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
