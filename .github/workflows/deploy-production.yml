name: Deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.event.pull_request.number || 'main' }}
  # Superseded pull request runs are cancelled. Runs on main always finish so a
  # deploy is never cut off partway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
      VITE_WORKOS_REDIRECT_URI: ${{ vars.VITE_WORKOS_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, and test workspace
        run: bun run checks
      - name: Check formatting
        run: bun run format:check
      - name: Build web
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing VITE_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/code/web
      - name: Build bin web
        env:
          VITE_WORKOS_REDIRECT_URI: ${{ vars.BIN_WORKOS_REDIRECT_URI }}
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing BIN_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/bin/web

  e2e-workos:
    # Fork pull requests cannot receive the dedicated test deployment secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image ships Chromium and its system libraries, so the job skips the
    # browser download and apt install. Keep the tag on the @playwright/test
    # version pinned in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_E2E_DEPLOY_KEY }}
      PIERRE_ORG: ${{ secrets.CODE_TEST_PIERRE_ORG }}
      PIERRE_PRIVATE_KEY: ${{ secrets.CODE_TEST_PIERRE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # oven-sh/setup-bun needs unzip, which this image lacks.
      - name: Install Bun
        run: npm install -g bun@1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate test credential source
        run: |
          if [ -n "$PIERRE_ORG" ] && [ -n "$PIERRE_PRIVATE_KEY" ]; then exit 0; fi
          case "$CONVEX_DEPLOY_KEY" in
            dev:*) ;;
            *) echo "CONVEX_E2E_DEPLOY_KEY must select a development credential source" >&2; exit 1 ;;
          esac
      - name: Test WorkOS sign-in and Program commits
        working-directory: apps/code/web
        run: bun run test:e2e:workos
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-browser-failures-workos
          path: apps/code/web/test-results/
          retention-days: 7

  e2e-editor:
    # Fork pull requests cannot receive the dedicated test deployment secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Each suite gets its own disposable backend, so suites run in parallel.
        suite: [editor, collaboration, build-upload]
    # See e2e-workos for why this image is used and how to keep its tag in sync.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_E2E_DEPLOY_KEY }}
      PIERRE_ORG: ${{ secrets.CODE_TEST_PIERRE_ORG }}
      PIERRE_PRIVATE_KEY: ${{ secrets.CODE_TEST_PIERRE_PRIVATE_KEY }}
      E2E_EDITOR_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # oven-sh/setup-bun needs unzip, which this image lacks.
      - name: Install Bun
        run: npm install -g bun@1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate test credential source
        run: |
          if [ -n "$PIERRE_ORG" ] && [ -n "$PIERRE_PRIVATE_KEY" ]; then exit 0; fi
          case "$CONVEX_DEPLOY_KEY" in
            dev:*) ;;
            *) echo "CONVEX_E2E_DEPLOY_KEY must select a development credential source" >&2; exit 1 ;;
          esac
      - name: Test ${{ matrix.suite }} suite with simulated Builder and Brain
        working-directory: apps/code/web
        run: bun run test:e2e:editor
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-browser-failures-${{ matrix.suite }}
          path: apps/code/web/test-results/
          retention-days: 7

  deploy:
    needs: [quality, e2e-workos, e2e-editor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      E2E_WORKOS_RESULT: ${{ needs.e2e-workos.result }}
      E2E_EDITOR_RESULT: ${{ needs.e2e-editor.result }}
      EVENT_NAME: ${{ github.event_name }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
      VITE_WORKOS_REDIRECT_URI: ${{ vars.VITE_WORKOS_REDIRECT_URI }}
    steps:
      - name: Require the validation jobs to pass
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "Code web quality checks did not pass: $QUALITY_RESULT" >&2
            exit 1
          fi
          failed=0
          require_e2e() {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then return 0; fi
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_FORK" = "true" ] && [ "$result" = "skipped" ]; then return 0; fi
            echo "$label end-to-end checks did not pass: $result" >&2
            failed=1
          }
          require_e2e "WorkOS" "$E2E_WORKOS_RESULT"
          require_e2e "Editor" "$E2E_EDITOR_RESULT"
          exit "$failed"
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'pull_request'
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: bun install --frozen-lockfile
      # Checks already passed in the quality job for this commit. The web build
      # is repeated here because Wrangler deploys its output, and rebuilding is
      # about as quick as moving the output between jobs.
      - name: Build web
        if: github.event_name != 'pull_request'
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing VITE_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/code/web
      - name: Build bin web
        if: github.event_name != 'pull_request'
        env:
          VITE_WORKOS_REDIRECT_URI: ${{ vars.BIN_WORKOS_REDIRECT_URI }}
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing BIN_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/bin/web
      - name: Deploy Convex backend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *) echo "CONVEX_DEPLOY_KEY must be a production deployment key" >&2; exit 1 ;;
          esac
          # Convex looks for TypeScript in this package, while Bun hoists it.
          mkdir -p node_modules
          ln -sfn ../../../node_modules/typescript node_modules/typescript
          bun run deploy --typecheck enable \
            --cmd-url-env-var-name CONVEX_TARGET_URL \
            --cmd 'if [ "$CONVEX_TARGET_URL" != "$VITE_CONVEX_URL" ]; then echo "Convex deploy key does not match VITE_CONVEX_URL" >&2; exit 1; fi'
      # Both steps are safe to run on every deploy. The seed brings the bin
      # catalog in line with the data, and the consolidation does nothing once
      # the old C-channel parts are gone. They must run after the deploy above,
      # so the functions they call exist.
      - name: Update bin catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *) echo "CONVEX_DEPLOY_KEY must be a production deployment key" >&2; exit 1 ;;
          esac
          bunx convex run binCatalog:seed
          bunx convex run binCatalog:consolidateCChannels
      - name: Deploy Cloudflare Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          bunx wrangler deploy --keep-vars \
            --var "VITE_CONVEX_URL:${VITE_CONVEX_URL}" \
            --var "VITE_WORKOS_CLIENT_ID:${VITE_WORKOS_CLIENT_ID}" \
            --var "VITE_WORKOS_REDIRECT_URI:${VITE_WORKOS_REDIRECT_URI}"
        working-directory: apps/code/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy bin Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          bunx wrangler deploy --keep-vars \
            --var "VITE_CONVEX_URL:${VITE_CONVEX_URL}" \
            --var "VITE_WORKOS_CLIENT_ID:${VITE_WORKOS_CLIENT_ID}" \
            --var "VITE_WORKOS_REDIRECT_URI:${BIN_WORKOS_REDIRECT_URI}"
        working-directory: apps/bin/web
        env:
          BIN_WORKOS_REDIRECT_URI: ${{ vars.BIN_WORKOS_REDIRECT_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
