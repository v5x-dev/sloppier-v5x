name: Deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  e2e-workos:
    # Fork pull requests cannot receive the dedicated test deployment secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: code-web-e2e-convex
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_E2E_DEPLOY_KEY }}
      E2E_CONVEX_URL: ${{ vars.CONVEX_E2E_URL }}
      PRODUCTION_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/code/web
      - name: Deploy backend to dedicated test deployment
        working-directory: packages/backend
        run: |
          : "${E2E_CONVEX_URL:?Missing CONVEX_E2E_URL}"
          : "${PRODUCTION_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          case "$CONVEX_DEPLOY_KEY" in
            dev:*) ;;
            *) echo "CONVEX_E2E_DEPLOY_KEY must be a development deployment key" >&2; exit 1 ;;
          esac
          if [ "$E2E_CONVEX_URL" = "$PRODUCTION_CONVEX_URL" ]; then
            echo "The end-to-end deployment must not be production" >&2; exit 1
          fi
          bunx convex deploy --typecheck enable --codegen disable \
            --cmd-url-env-var-name CONVEX_TARGET_URL \
            --cmd 'if [ "$CONVEX_TARGET_URL" != "$E2E_CONVEX_URL" ]; then echo "Test deploy key does not match CONVEX_E2E_URL" >&2; exit 1; fi'
          printf 'CONVEX_DEPLOYMENT=dev:ci-e2e\nCONVEX_URL=%s\n' "$E2E_CONVEX_URL" > .env.local
      - name: Test WorkOS sign-in
        working-directory: apps/code/web
        run: bun run test:e2e:workos

  quality-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID }}
      VITE_WORKOS_REDIRECT_URI: ${{ vars.VITE_WORKOS_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint Code web dependency graph
        run: bunx turbo run lint --filter=@v5x/code-web
      - name: Typecheck Code web dependency graph
        run: bunx turbo run typecheck --filter=@v5x/code-web
      - name: Test Code web dependency graph
        run: bunx turbo run test --filter=@v5x/code-web
      - name: Build web
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing VITE_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/code/web

  deploy:
    needs: [e2e-workos, quality-pr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_RESULT: ${{ needs.e2e-workos.result }}
      QUALITY_RESULT: ${{ needs.quality-pr.result }}
      EVENT_NAME: ${{ github.event_name }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - name: Require the validation jobs to pass
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$QUALITY_RESULT" != "success" ]; then
              echo "Code web quality checks did not pass: $QUALITY_RESULT" >&2
              exit 1
            fi
            if [ "$E2E_RESULT" = "success" ]; then exit 0; fi
            if [ "$IS_FORK" = "true" ] && [ "$E2E_RESULT" = "skipped" ]; then exit 0; fi
            echo "WorkOS end-to-end checks did not pass: $E2E_RESULT" >&2
            exit 1
          fi
          if [ "$E2E_RESULT" != "success" ] || [ "$QUALITY_RESULT" != "skipped" ]; then
            echo "Validation jobs did not pass (e2e=$E2E_RESULT, PR quality=$QUALITY_RESULT)" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - name: Check for backend changes
        id: backend-changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- packages/backend/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'pull_request'
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: bun install --frozen-lockfile
      - name: Lint workspace
        if: github.event_name != 'pull_request'
        run: bun run lint
      - name: Typecheck workspace
        if: github.event_name != 'pull_request'
        run: bun run typecheck
      - name: Test workspace
        if: github.event_name != 'pull_request'
        run: bun run test
      - name: Build web
        if: github.event_name != 'pull_request'
        run: |
          : "${VITE_CONVEX_URL:?Missing VITE_CONVEX_URL}"
          : "${VITE_WORKOS_CLIENT_ID:?Missing VITE_WORKOS_CLIENT_ID}"
          : "${VITE_WORKOS_REDIRECT_URI:?Missing VITE_WORKOS_REDIRECT_URI}"
          bun run build
        working-directory: apps/code/web
      - name: Deploy Convex backend
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || steps.backend-changes.outputs.changed == 'true')
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *) echo "CONVEX_DEPLOY_KEY must be a production deployment key" >&2; exit 1 ;;
          esac
          bun run deploy --typecheck enable \
            --cmd-url-env-var-name CONVEX_TARGET_URL \
            --cmd 'if [ "$CONVEX_TARGET_URL" != "$VITE_CONVEX_URL" ]; then echo "Convex deploy key does not match VITE_CONVEX_URL" >&2; exit 1; fi'
      - name: Deploy Cloudflare Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          bunx wrangler deploy --keep-vars \
            --var "VITE_CONVEX_URL:${VITE_CONVEX_URL}" \
            --var "VITE_WORKOS_CLIENT_ID:${VITE_WORKOS_CLIENT_ID}" \
            --var "VITE_WORKOS_REDIRECT_URI:${VITE_WORKOS_REDIRECT_URI}"
        working-directory: apps/code/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
